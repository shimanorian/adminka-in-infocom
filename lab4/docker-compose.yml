services:
  pg-primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
    volumes:
      - ./primary/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - primary-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "appdb"]
      interval: 3s
      retries: 20

  pg-replica:
    image: postgres:16
    container_name: pg-replica
    user: postgres
    environment:
      PGPASSWORD: replpass
    depends_on:
      pg-primary:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Копирую данные с primary..."
          pg_basebackup -h pg-primary -U replicator -D /var/lib/postgresql/data -R -X stream -P
          chmod 700 /var/lib/postgresql/data
        fi
        exec postgres -c hot_standby=on
    volumes:
      - replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: ./app
    container_name: notes-app
    environment:
      PRIMARY_DSN: postgresql://app:app@pg-primary:5432/appdb   # запись
      REPLICA_DSN: postgresql://app:app@pg-replica:5432/appdb   # чтение
    depends_on:
      - pg-primary
      - pg-replica
    ports:
      - "8080:8080"

  # --- мониторинг ---
  exporter-primary:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: exporter-primary
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@pg-primary:5432/appdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yml
    volumes:
      - ./monitoring/queries.yml:/queries.yml:ro
    depends_on:
      - pg-primary

  exporter-replica:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: exporter-replica
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@pg-replica:5432/appdb?sslmode=disable
    depends_on:
      - pg-replica

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"

volumes:
  primary-data:
  replica-data:
